<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dzikir</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c1730">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dzikir">
<style>
  :root{
    --navy-deep:#0c1730;
    --navy:#14213f;
    --navy-light:#1f2f54;
    --gold:#c9a227;
    --gold-bright:#e6c65c;
    --ink:#eee2c4;
    --ink-dim:#a9a08a;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(ellipse at top, var(--navy-light) 0%, var(--navy) 45%, var(--navy-deep) 100%);
    font-family:"Cormorant Garamond","EB Garamond",Georgia,serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
    padding:24px 18px 32px;
  }
  .frame{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  h1{
    font-weight:600;
    letter-spacing:.04em;
    font-size:1.5rem;
    color:var(--gold-bright);
    margin:6px 0 0;
  }
  .rule{
    width:120px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-bottom:2px;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .tab{
    border:1px solid rgba(201,162,39,.35);
    background:rgba(255,255,255,.02);
    color:var(--ink-dim);
    padding:6px 14px;
    border-radius:999px;
    font-size:.95rem;
    letter-spacing:.02em;
    cursor:pointer;
    font-family:inherit;
    transition:border-color .2s, color .2s, background .2s;
  }
  .tab.active{
    border-color:var(--gold);
    color:var(--gold-bright);
    background:rgba(201,162,39,.1);
  }
  .dial-wrap{
    position:relative;
    width:min(78vw,300px);
    height:min(78vw,300px);
    margin-top:6px;
  }
  svg.ring{
    position:absolute;
    inset:0;
    transform:rotate(-90deg);
  }
  svg.ring circle{
    fill:none;
    stroke-width:6;
  }
  .ring-bg{ stroke: rgba(255,255,255,.08); }
  .ring-fg{
    stroke: var(--gold);
    stroke-linecap:round;
    transition: stroke-dashoffset .25s ease;
  }
  button.dial{
    position:absolute;
    inset:14px;
    border-radius:50%;
    border:1px solid rgba(201,162,39,.3);
    background: radial-gradient(circle at 50% 35%, var(--navy-light), var(--navy-deep) 80%);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    font-family:inherit;
    -webkit-user-select:none;
    user-select:none;
  }
  button.dial:active{ transform:scale(.97); }
  .arabic{
    font-family:"Amiri","Scheherazade New","Traditional Arabic",serif;
    font-size:2.1rem;
    line-height:1.3;
    color:var(--gold-bright);
    direction:rtl;
  }
  .meaning{
    font-size:1rem;
    color:var(--ink-dim);
    max-width:80%;
    text-align:center;
  }
  .count{
    font-size:2.6rem;
    font-weight:600;
    color:var(--ink);
    letter-spacing:.02em;
    margin-top:2px;
  }
  .target{ font-size:.9rem; color:var(--ink-dim); }
  .controls{ display:flex; gap:14px; margin-top:4px; }
  .ctrl-btn{
    border:1px solid rgba(201,162,39,.35);
    background:transparent;
    color:var(--ink-dim);
    padding:8px 16px;
    border-radius:8px;
    font-family:inherit;
    font-size:.95rem;
    cursor:pointer;
    transition:color .2s, border-color .2s;
  }
  .ctrl-btn:hover{ color:var(--gold-bright); border-color:var(--gold); }
  .target-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.9rem;
    color:var(--ink-dim);
  }
  .target-row input{
    width:64px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(201,162,39,.3);
    color:var(--ink);
    border-radius:6px;
    padding:4px 8px;
    font-family:inherit;
    font-size:.95rem;
    text-align:center;
  }
  .done-msg{
    font-size:.95rem;
    color:var(--gold-bright);
    min-height:1.2em;
    text-align:center;
  }
  footer{
    margin-top:20px;
    font-size:.78rem;
    color:rgba(169,160,138,.5);
    text-align:center;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="frame">
  <h1>Dzikir</h1>
  <div class="rule"></div>

  <div class="tabs" id="tabs"></div>

  <div class="dial-wrap">
    <svg class="ring" viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="92"></circle>
      <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="92" stroke-dasharray="578" stroke-dashoffset="578"></circle>
    </svg>
    <button class="dial" id="dial">
      <div class="arabic" id="arabicText"></div>
      <div class="meaning" id="meaningText"></div>
      <div class="count" id="countText">0</div>
      <div class="target" id="targetText"></div>
    </button>
  </div>

  <div class="done-msg" id="doneMsg">&nbsp;</div>

  <div class="controls">
    <button class="ctrl-btn" id="undoBtn">Mundur</button>
    <button class="ctrl-btn" id="resetBtn">Ulangi</button>
  </div>

  <div class="target-row">
    <span>Target:</span>
    <input type="number" id="targetInput" min="1">
    <span>hitungan</span>
  </div>

  <footer>Ketuk lingkaran untuk menghitung &middot; tersimpan otomatis di perangkat ini</footer>
</div>

<script>
(function(){
  var DZIKIR = [
    { key:"subhanallah", label:"Subhanallah", arabic:"سُبْحَانَ اللَّهِ", meaning:"Maha Suci Allah", target:33 },
    { key:"alhamdulillah", label:"Alhamdulillah", arabic:"الْحَمْدُ لِلَّهِ", meaning:"Segala puji bagi Allah", target:33 },
    { key:"allahuakbar", label:"Allahu Akbar", arabic:"اللَّهُ أَكْبَرُ", meaning:"Allah Maha Besar", target:34 },
    { key:"laailaha", label:"La ilaha illallah", arabic:"لَا إِلَٰهَ إِلَّا اللَّهُ", meaning:"Tiada tuhan selain Allah", target:100 },
    { key:"astaghfirullah", label:"Astaghfirullah", arabic:"أَسْتَغْفِرُ اللَّهَ", meaning:"Aku memohon ampun kepada Allah", target:100 },
    { key:"sholawat", label:"Sholawat", arabic:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ", meaning:"Ya Allah, limpahkan shalawat atas Nabi Muhammad", target:100 }
  ];

  var STORAGE_KEY = "dzikir_app_state_v1";
  var state = {};
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw) || {};
  }catch(e){ state = {}; }

  var activeKey = state.__active || DZIKIR[0].key;

  function getEntry(key){
    if(!state[key]){
      var d = DZIKIR.find(function(x){ return x.key===key; });
      state[key] = { count:0, target: d ? d.target : 33 };
    }
    return state[key];
  }

  function save(){
    state.__active = activeKey;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var tabsEl = document.getElementById("tabs");
  var arabicEl = document.getElementById("arabicText");
  var meaningEl = document.getElementById("meaningText");
  var countEl = document.getElementById("countText");
  var targetEl = document.getElementById("targetText");
  var targetInput = document.getElementById("targetInput");
  var ringFg = document.getElementById("ringFg");
  var doneMsg = document.getElementById("doneMsg");
  var dial = document.getElementById("dial");
  var CIRC = 2 * Math.PI * 92;

  DZIKIR.forEach(function(d){
    var btn = document.createElement("button");
    btn.className = "tab";
    btn.textContent = d.label;
    btn.dataset.key = d.key;
    btn.addEventListener("click", function(){
      activeKey = d.key;
      save();
      render();
    });
    tabsEl.appendChild(btn);
  });

  function currentDef(){
    return DZIKIR.find(function(x){ return x.key===activeKey; });
  }

  function render(){
    var def = currentDef();
    var entry = getEntry(activeKey);

    Array.prototype.forEach.call(tabsEl.children, function(el){
      el.classList.toggle("active", el.dataset.key === activeKey);
    });

    arabicEl.textContent = def.arabic;
    meaningEl.textContent = def.meaning;
    countEl.textContent = entry.count;
    targetEl.textContent = "dari " + entry.target;
    targetInput.value = entry.target;

    var frac = Math.min(entry.count / entry.target, 1);
    ringFg.setAttribute("stroke-dasharray", CIRC);
    ringFg.setAttribute("stroke-dashoffset", CIRC * (1 - frac));

    if(entry.count > 0 && entry.count % entry.target === 0){
      doneMsg.textContent = "Alhamdulillah, " + entry.target + " genap \u2014 " + Math.floor(entry.count/entry.target) + "x putaran";
    } else {
      doneMsg.innerHTML = "&nbsp;";
    }
  }

  function tap(){
    var entry = getEntry(activeKey);
    entry.count += 1;
    save();
    render();
    if(navigator.vibrate){
      navigator.vibrate(entry.count % entry.target === 0 ? [15,60,15] : 12);
    }
  }

  dial.addEventListener("click", tap);

  document.getElementById("undoBtn").addEventListener("click", function(){
    var entry = getEntry(activeKey);
    entry.count = Math.max(0, entry.count - 1);
    save();
    render();
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    var entry = getEntry(activeKey);
    entry.count = 0;
    save();
    render();
  });

  targetInput.addEventListener("change", function(){
    var entry = getEntry(activeKey);
    var v = parseInt(targetInput.value, 10);
    entry.target = (v && v > 0) ? v : entry.target;
    save();
    render();
  });

  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
